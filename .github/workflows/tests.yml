name: Run Tests

on:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iknowaplace-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iknowaplace-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iknowaplace-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iknowaplace-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci
